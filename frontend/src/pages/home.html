<script>

if (typeof L === 'undefined') {

  document.body.innerHTML = `
    <div style="
      padding:24px;
      font-family:system-ui,sans-serif;
    ">
      Map library failed to load.
      Check your internet connection and browser console.
    </div>
  `;

} else {

  // =========================================================
  // API
  // =========================================================

  const API_BASE = "http://127.0.0.1:8000/api";


  // =========================================================
  // CREATE MAP
  // =========================================================

  const map = L.map("map", {

    center: [22.5726, 88.3639],

    zoom: 12,

    zoomControl: {
      position: "bottomright"
    }

  });


  // =========================================================
  // OPENSTREETMAP
  // =========================================================

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,

      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);


  // =========================================================
  // ELEMENTS
  // =========================================================

  const feedList =
    document.getElementById("feedList");

  const riskFilters =
    document.querySelectorAll(".risk-filter");

  const catFilters =
    document.querySelectorAll(".cat-filter");


  // =========================================================
  // VARIABLES
  // =========================================================

  let allCases = [];

  let markers = [];

  let heatLayer = null;


  // =========================================================
  // LOAD CASES FROM BACKEND
  // =========================================================

  (async () => {

    try {

      const res =
        await fetch(`${API_BASE}/cases`);

      if (!res.ok) {

        throw new Error(
          "Failed to load cases"
        );

      }

      const cases =
        await res.json();

      allCases = cases;

      initMapData(cases);

      setupFilterListeners();

    }

    catch (err) {

      console.error(err);

      feedList.innerHTML = `
        <div class="text-body-sm text-error">
          Error loading cases:
          ${err.message}
        </div>
      `;

    }

  })();


  // =========================================================
  // INITIALIZE MAP DATA
  // =========================================================

  function initMapData(cases) {

    const heatPoints = [];

    feedList.innerHTML = "";


    // Remove existing markers

    markers.forEach(
      m => m.marker.remove()
    );

    markers = [];


    // Create marker for every case

    cases.forEach(c => {

      let lat = c.latitude;

      let lng = c.longitude;


      // If location doesn't exist,
      // temporarily place around Kolkata

      if (
        lat == null ||
        lng == null
      ) {

        const dLat =
          (Math.random() - 0.5) * 0.05;

        const dLng =
          (Math.random() - 0.5) * 0.05;

        lat =
          22.5726 + dLat;

        lng =
          88.3639 + dLng;

      }


      // Risk intensity

      const intensity =
        (c.risk_score || 50) / 100;


      heatPoints.push([
        lat,
        lng,
        intensity
      ]);


      // =====================================================
      // MARKER
      // =====================================================

      const marker =
        L.marker([lat, lng])
        .addTo(map);


      // =====================================================
      // POPUP
      // =====================================================

      const popupContent = `

        <div style="min-width:180px;">

          <div
            style="
              font-weight:bold;
              margin-bottom:4px;
            "
          >
            ${c.title}
          </div>


          <div
            style="
              font-size:12px;
              margin-bottom:2px;
            "
          >
            ID: ${c.id}
          </div>


          <div
            style="
              font-size:12px;
              margin-bottom:2px;
            "
          >
            Category: ${c.category}
          </div>


          <div
            style="
              font-size:12px;
              margin-bottom:4px;
            "
          >
            Status: ${c.status}
          </div>


          <a
            href="track-report.html?id=${c.id}"
            target="_blank"
            style="font-size:12px;"
          >
            Track this case
          </a>

        </div>

      `;


      marker.bindPopup(
        popupContent
      );


      // Store marker

      markers.push({

        marker: marker,

        case: c,

        lat: lat,

        lng: lng

      });


      // Create feed card

      const card =
        createFeedCard(
          c,
          lat,
          lng,
          marker
        );


      feedList.appendChild(card);

    });


    // =====================================================
    // HEATMAP
    // =====================================================

    if (heatLayer) {

      map.removeLayer(
        heatLayer
      );

    }


    if (heatPoints.length > 0) {

      heatLayer =
        L.heatLayer(
          heatPoints,
          {

            radius: 25,

            blur: 15,

            maxZoom: 15,

            gradient: {

              0.0: "white",

              0.3: "yellow",

              0.6: "orange",

              1.0: "red"

            }

          }
        ).addTo(map);

    }


    // No cases

    if (cases.length === 0) {

      feedList.innerHTML = `

        <div
          class="text-body-sm text-on-surface-variant"
        >
          No cases yet.
          Be the first to report!
        </div>

      `;

    }


    applyFilters();

  }


  // =========================================================
  // CREATE FEED CARD
  // =========================================================

  function createFeedCard(
    c,
    lat,
    lng,
    marker
  ) {

    const card =
      document.createElement("div");


    card.className =
      "bg-white rounded-lg border border-outline-variant p-3 shadow-sm hover:border-primary cursor-pointer transition-colors";


    const riskLabel =
      getRiskLabel(
        c.risk_score
      );


    const riskClass =
      getRiskClass(
        c.risk_score
      );


    card.innerHTML = `

      <div
        class="flex justify-between items-start mb-2"
      >

        <span
          class="${riskClass}
          text-label-sm
          font-label-sm
          px-2
          py-0.5
          rounded
          font-bold"
        >
          ${riskLabel}
        </span>


        <span
          class="text-label-sm
          font-label-sm
          text-outline"
        >
          ${formatTime(c.created_at)}
        </span>

      </div>


      <h4
        class="text-label-md
        font-label-md
        font-bold
        mb-1"
      >
        ${c.title}
      </h4>


      <p
        class="text-body-sm
        font-body-sm
        text-on-surface-variant
        mb-2"
      >
        ${c.description}
      </p>


      <div
        class="text-label-sm
        font-label-sm
        text-outline
        font-mono"
      >
        ID: ${c.id}
      </div>

    `;


    // Click card -> map marker

    card.addEventListener(
      "click",
      () => {

        map.setView(
          [lat, lng],
          15
        );

        marker.openPopup();

      }
    );


    return card;

  }


  // =========================================================
  // FILTER LISTENERS
  // =========================================================

  function setupFilterListeners() {

    riskFilters.forEach(
      cb =>
        cb.addEventListener(
          "change",
          applyFilters
        )
    );


    catFilters.forEach(
      cb =>
        cb.addEventListener(
          "change",
          applyFilters
        )
    );

  }


  // =========================================================
  // APPLY FILTERS
  // =========================================================

  function applyFilters() {

    const selectedRisks =
      Array.from(riskFilters)

        .filter(
          cb => cb.checked
        )

        .map(
          cb => cb.dataset.risk
        );


    const selectedCats =
      Array.from(catFilters)

        .filter(
          cb => cb.checked
        )

        .map(
          cb => cb.dataset.cat
        );


    // Filter markers

    markers.forEach(
      ({
        marker,
        case: c
      }) => {

        const riskOk =
          riskMatches(
            c,
            selectedRisks
          );


        const catOk =
          catMatches(
            c,
            selectedCats
          );


        if (
          riskOk &&
          catOk
        ) {

          if (
            !map.hasLayer(marker)
          ) {

            marker.addTo(map);

          }

        } else {

          if (
            map.hasLayer(marker)
          ) {

            marker.remove();

          }

        }

      }
    );


    // =====================================================
    // REBUILD FEED
    // =====================================================

    feedList.innerHTML = "";


    markers.forEach(
      ({
        marker,
        case: c,
        lat,
        lng
      }) => {

        if (
          !map.hasLayer(marker)
        ) {

          return;

        }


        const card =
          createFeedCard(
            c,
            lat,
            lng,
            marker
          );


        feedList.appendChild(card);

      }
    );


    // =====================================================
    // UPDATE HEATMAP
    // =====================================================

    const visiblePoints =
      markers

        .filter(
          ({ marker }) =>
            map.hasLayer(marker)
        )

        .map(
          ({
            case: c,
            lat,
            lng
          }) => {

            const intensity =
              (c.risk_score || 50)
              / 100;

            return [
              lat,
              lng,
              intensity
            ];

          }
        );


    if (heatLayer) {

      map.removeLayer(
        heatLayer
      );

    }


    if (
      visiblePoints.length > 0
    ) {

      heatLayer =
        L.heatLayer(
          visiblePoints,
          {

            radius: 25,

            blur: 15,

            maxZoom: 15,

            gradient: {

              0.0: "white",

              0.3: "yellow",

              0.6: "orange",

              1.0: "red"

            }

          }
        ).addTo(map);

    }

  }


  // =========================================================
  // RISK MATCH
  // =========================================================

  function riskMatches(
    c,
    selectedRisks
  ) {

    const score =
      c.risk_score || 0;


    let riskLevel;


    if (score >= 75) {

      riskLevel = "critical";

    }

    else if (score >= 50) {

      riskLevel = "high";

    }

    else if (score >= 25) {

      riskLevel = "moderate";

    }

    else {

      riskLevel = "low";

    }


    return (
      selectedRisks.length === 0 ||
      selectedRisks.includes(
        riskLevel
      )
    );

  }


  // =========================================================
  // CATEGORY MATCH
  // =========================================================

  function catMatches(
    c,
    selectedCats
  ) {

    const cat =
      c.category || "";


    return (
      selectedCats.length === 0 ||
      selectedCats.includes(cat)
    );

  }


  // =========================================================
  // RISK LABEL
  // =========================================================

  function getRiskLabel(
    score
  ) {

    if (!score) {

      return "LOW";

    }


    if (score >= 75) {

      return "CRITICAL";

    }


    if (score >= 50) {

      return "HIGH";

    }


    if (score >= 25) {

      return "MODERATE";

    }


    return "LOW";

  }


  // =========================================================
  // RISK CSS
  // =========================================================

  function getRiskClass(
    score
  ) {

    if (!score) {

      return "bg-tertiary text-on-tertiary";

    }


    if (score >= 75) {

      return "bg-error text-on-error";

    }


    if (score >= 50) {

      return "bg-orange-500 text-white";

    }


    if (score >= 25) {

      return "bg-yellow-500 text-white";

    }


    return "bg-tertiary text-on-tertiary";

  }


  // =========================================================
  // FORMAT TIME
  // =========================================================

  function formatTime(
    isoString
  ) {

    if (!isoString) {

      return "";

    }


    const d =
      new Date(isoString);


    const now =
      new Date();


    const diffMs =
      now - d;


    const mins =
      Math.floor(
        diffMs / 60000
      );


    if (mins < 1) {

      return "Just now";

    }


    if (mins < 60) {

      return `${mins}m ago`;

    }


    const hrs =
      Math.floor(
        mins / 60
      );


    if (hrs < 24) {

      return `${hrs}h ago`;

    }


    const days =
      Math.floor(
        hrs / 24
      );


    return `${days}d ago`;

  }

}
